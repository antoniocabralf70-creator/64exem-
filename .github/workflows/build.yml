                      } catch (e: Exception) {
                      }
                      if (library.games.any { it.uri == uri.toString() }) continue
                      val g = Game(UUID.randomUUID().toString(), uri.toString(), Rom.displayName(this, uri), Rom.internalName(this, uri), null)
                      library.add(g)
                      added++
                      Covers.autoAsync(this, library, listOf(g)) { games.refresh() }
                  }
                  games.refresh()
                  if (added == 0 && uris.isNotEmpty()) {
                      Toast.makeText(this, "Esse jogo já está na lista.", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun onCoverPicked(uri: Uri?) {
                  val id = coverTarget
                  if (uri == null || id == null) return
