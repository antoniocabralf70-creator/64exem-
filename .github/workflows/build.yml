          /** Lista de jogos conhecidos (No-Intro, via libretro-database): CRC32 -> nome oficial. */
          class GameDb(val byCrc: Map<String, String>, private val byCode: Map<String, List<String>>, private val names: List<String>) {
              private fun norm(s: String): String =
                  s.lowercase().replace(Regex("\\(.*?\\)|\\[.*?\\]"), " ").replace(Regex("[^a-z0-9]+"), " ").trim()

              private fun best(list: List<String>): String? =
                  list.firstOrNull { it.contains("(USA)") } ?: list.firstOrNull { it.contains("(Europe)") } ?: list.firstOrNull()

              /** Procura pelo código de 4 letras do cartucho (serve para ROM hacks do mesmo jogo). */
              fun byGameCode(code: String): String? = if (code.length < 4) null else byCode[code]?.let { best(it) }

              /** Procura pelo nome do arquivo, ignorando etiquetas como (USA) e [!]. */
              fun byName(title: String): String? {
                  val n = norm(title)
                  if (n.isEmpty()) return null
                  return best(names.filter { norm(it) == n })
              }
          }

          object Covers {
              private const val THUMBS = "https://thumbnails.libretro.com/Nintendo%20-%20Nintendo%2064"
              private val DAT_URLS = listOf(
                  "https://raw.githubusercontent.com/libretro/libretro-database/master/metadat/no-intro/Nintendo%20-%20Nintendo%2064.dat",
                  "https://raw.githubusercontent.com/libretro/libretro-database/master/dat/Nintendo%20-%20Nintendo%2064.dat"
              )
              private val worker = Executors.newSingleThreadExecutor()
              private val main = Handler(Looper.getMainLooper())
              private val lock = Any()
              private var db: GameDb? = null
              private var downloadFailed = false

              fun dir(ctx: Context): File = File(ctx.filesDir, "covers").apply { mkdirs() }

              // ---------- lista de jogos ----------

              private fun parseDat(text: String): GameDb {
                  val byCrc = HashMap<String, String>()
                  val byCode = HashMap<String, MutableList<String>>()
                  val names = ArrayList<String>()
                  val crcRe = Regex("crc ([0-9A-Fa-f]{8})")
                  val serialRe = Regex("serial \"([^\"]+)\"")
                  var inGame = false
                  var cur: String? = null
                  for (raw in text.lineSequence()) {
                      val l = raw.trim()
                      if (l.startsWith("game (")) { inGame = true; cur = null; continue }
                      if (!inGame) continue
                      if (l == ")") { inGame = false; cur = null; continue }
                      if (cur == null && l.startsWith("name \"")) {
                          val end = l.lastIndexOf('"')
                          if (end > 6) { val nm = l.substring(6, end); cur = nm; names.add(nm) }
                          continue
                      }
                      if (cur != null && l.startsWith("rom (")) {
                          crcRe.find(l)?.let { byCrc[it.groupValues[1].uppercase()] = cur!! }
                          serialRe.find(l)?.let {
                              val parts = it.groupValues[1].split('-')
                              val code = if (parts.size >= 2) parts[1] else parts[0]
                              if (code.length == 4) byCode.getOrPut(code) { ArrayList() }.add(cur!!)
                          }
                      }
                  }
                  return GameDb(byCrc, byCode, names)
              }

              private fun download(url: String, out: File): Boolean {
                  try {
                      val c = URL(url).openConnection() as HttpURLConnection
                      c.connectTimeout = 10000
                      c.readTimeout = 20000
                      if (c.responseCode != 200) return false
                      val tmp = File(out.parentFile, out.name + ".tmp")
                      c.inputStream.use { i -> tmp.outputStream().use { o -> i.copyTo(o) } }
                      if (tmp.length() == 0L) { tmp.delete(); return false }
                      out.delete()
                      return tmp.renameTo(out)
                  } catch (e: Exception) {
                      return false
                  }
              }

              /** Baixa a lista uma vez (e renova a cada 30 dias). Sem internet usa a cópia guardada. */
              private fun loadDb(ctx: Context): GameDb? {
                  synchronized(lock) {
                      db?.let { return it }
                      val f = File(ctx.filesDir, "n64_games.dat")
                      val old = !f.exists() || System.currentTimeMillis() - f.lastModified() > 30L * 24 * 3600 * 1000
                      if (old && !downloadFailed) {
                          var ok = false
                          for (u in DAT_URLS) { if (download(u, f)) { ok = true; break } }
                          if (!ok) downloadFailed = true  // sem internet: não tenta de novo nesta sessão
                      }
                      if (!f.exists()) return null
                      return try {
                          val d = parseDat(f.readText(Charsets.UTF_8))
                          if (d.byCrc.isEmpty()) null else { db = d; d }
                      } catch (e: Exception) {
                          null
                      }
                  }
              }

              // ---------- capas ----------

              private fun thumbName(name: String): String =
                  URLEncoder.encode(name.replace(Regex("[&*/:`<>?\\\\|\"]"), "_"), "UTF-8").replace("+", "%20")

              private fun fetchImage(ctx: Context, id: String, name: String): String? {
                  val enc = thumbName(name)
                  for (kind in listOf("Named_Boxarts", "Named_Titles", "Named_Snaps")) {
                      val out = File(dir(ctx), "$id.png")
                      if (download("$THUMBS/$kind/$enc.png", out)) return out.absolutePath
                  }
                  return null
              }

              /**
               * Reconhece o jogo (CRC32 da ROM) e busca a capa. Retorna true se algo mudou.
               * force = true troca a capa mesmo que o jogo já tenha uma.
               */
              fun auto(ctx: Context, g: Game, force: Boolean = false): Boolean {
                  var changed = false
                  val uri = Uri.parse(g.uri)
                  if (g.crc == null) { g.crc = Rom.crc32(ctx, uri); changed = g.crc != null }
                  val hasCover = g.cover != null && File(g.cover!!).exists()
                  if (hasCover && !force && g.recognized) return changed

                  val d = loadDb(ctx)
                  var official: String? = null
                  if (d != null) {
                      val byCrc = g.crc?.let { d.byCrc[it] }
                      if (byCrc != null) {
                          official = byCrc
                          if (!g.recognized || g.title != byCrc) { g.title = byCrc; g.recognized = true; changed = true }
                      } else {
                          // ROM modificada ou fora da lista: tenta pelo código do cartucho e depois pelo nome do arquivo
                          official = d.byGameCode(Rom.gameCode(ctx, uri)) ?: d.byName(g.title)
                      }
                  }
                  if (!hasCover || force) {
                      var p: String? = null
                      if (official != null) p = fetchImage(ctx, g.id, official)
                      if (p == null && official != g.title) p = fetchImage(ctx, g.id, g.title)
                      if (p != null) { g.cover = p; changed = true }
                  }
                  return changed
              }

              /** Roda um jogo por vez em segundo plano; chama onChange (na tela principal) a cada mudança. */
              fun autoAsync(ctx: Context, lib: Library, games: List<Game>, force: Boolean = false, onDone: ((Boolean) -> Unit)? = null, onChange: () -> Unit) {
                  val app = ctx.applicationContext
                  for (g in games) {
                      worker.execute {
                          var changed = false
                          try {
                              changed = auto(app, g, force)
                              if (changed) {
                                  lib.save()
                                  main.post(onChange)
                              }
                          } catch (e: Throwable) {
                          }
                          if (onDone != null) main.post { onDone(changed) }
                      }
                  }
              }

              fun saveFromUri(ctx: Context, uri: Uri, id: String): String? {
                  try {
                      val bounds = BitmapFactory.Options()
                      bounds.inJustDecodeBounds = true
                      ctx.contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, bounds) }
                      var s = 1
                      while (bounds.outWidth / s > 600) s *= 2
                      val opts = BitmapFactory.Options()
                      opts.inSampleSize = s
                      val bmp = ctx.contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, opts) } ?: return null
                      val f = File(dir(ctx), "$id.jpg")
                      f.outputStream().use { bmp.compress(Bitmap.CompressFormat.JPEG, 90, it) }
                      return f.absolutePath
                  } catch (e: Exception) {
                      return null
                  }
              }

              fun load(path: String, maxW: Int): Bitmap? {
                  try {
                      val bounds = BitmapFactory.Options()
                      bounds.inJustDecodeBounds = true
                      BitmapFactory.decodeFile(path, bounds)
                      var s = 1
                      while (bounds.outWidth / (s * 2) >= maxW) s *= 2
                      val opts = BitmapFactory.Options()
                      opts.inSampleSize = s
                      return BitmapFactory.decodeFile(path, opts)
                  } catch (e: Exception) {
                      return null
                  }
              }
          }
