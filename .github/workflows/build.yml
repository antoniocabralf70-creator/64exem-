          package dev.n64emu.app

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.abs
          import kotlin.math.hypot

          /**
           * Controles na tela. IDs 0..15 = botões RetroPad; 100..103 = botões C.
           * O analógico é flutuante: nasce onde o dedo toca (perto da posição dele), segue o dedo
           * e só aquele dedo o controla. Isso evita os "pulos" do analógico.
           *
           * edit = true: modo de edição (arrastar para mover, escolher tamanho, ocultar). Não envia nada ao jogo.
           * Itens editáveis: cada botão solto, o D-pad (grupo), os botões C (grupo) e o analógico.
           */
          class ControlsView(ctx: Context, private val edit: Boolean = false) : View(ctx) {
              private class Item(val key: Int, val name: String, val dcx: Float, val dcy: Float, val dr: Float, val dsp: Float = 0f) {
                  var cx = dcx
                  var cy = dcy
                  var scale = 1f
                  var visible = true
                  val r get() = dr * scale
                  val sp get() = dsp * scale
              }

              private class Circ(val id: Int, val label: String, val x: Float, val y: Float, val r: Float, val dim: Boolean)

              private companion object {
                  const val K_STICK = 200
                  const val K_DPAD = 300
                  const val K_C = 301
              }

              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private var items = listOf<Item>()
              private var circs = listOf<Circ>()
              private val pressed = BooleanArray(16)
              private var cX = 0f
              private var cY = 0f

              private var stick: Item? = null
              private var stickPid = -1
              private var ox = 0f
              private var oy = 0f
              private var kx = 0f
              private var ky = 0f
              private var outX = 0f
              private var outY = 0f
              private val dead = 0.12f

              // edição
              private var selected: Item? = null
              private var dragDx = 0f
              private var dragDy = 0f
              private var ignoreSaved = false

              /** Avisa o editor quando a seleção muda: nome, tamanho em %, visível, pode ocultar. */
              var onSelection: ((String?, Int, Boolean, Boolean) -> Unit)? = null

              private fun dp(v: Float) = v * resources.displayMetrics.density

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  val u = h.toFloat()
                  val W = w.toFloat()
                  val d = 0.095f * u
                  val dr = 0.05f * u
                  val list = ArrayList<Item>()
                  list.add(Item(K_STICK, "Analógico", 0.17f * W, 0.76f * u, 0.17f * u))
                  list.add(Item(K_DPAD, "D-pad", 0.11f * W, 0.31f * u, dr, d))
                  list.add(Item(K_C, "Botões C", 0.80f * W, 0.30f * u, 0.05f * u, 0.10f * u))
                  list.add(Item(0, "A", 0.91f * W, 0.68f * u, 0.085f * u))
                  list.add(Item(1, "B", 0.80f * W, 0.78f * u, 0.075f * u))
                  list.add(Item(3, "Start", 0.50f * W, 0.92f * u, 0.055f * u))
                  list.add(Item(10, "L", 0.07f * W, 0.09f * u, 0.065f * u))
                  list.add(Item(12, "Z", 0.16f * W, 0.09f * u, 0.065f * u))
                  list.add(Item(11, "R", 0.93f * W, 0.09f * u, 0.065f * u))
                  val saved = if (ignoreSaved) emptyMap<Int, ItemPrefs>() else ControlsLayout.load(context)
                  for (it in list) {
                      val p = saved[it.key] ?: continue
                      it.cx = (p.x * W).coerceIn(0f, W)
                      it.cy = (p.y * u).coerceIn(0f, u)
                      it.scale = p.scale.coerceIn(0.5f, 2f)
                      it.visible = p.visible || it.key == K_STICK
                  }
                  items = list
                  stick = list.first { it.key == K_STICK }
                  selected = null
                  rebuild()
              }

              private fun label(id: Int) = when (id) {
                  0 -> "A"; 1 -> "B"; 3 -> "ST"; 10 -> "L"; 11 -> "R"; 12 -> "Z"; else -> "?"
              }

              private fun rebuild() {
                  val l = ArrayList<Circ>()
                  for (it in items) {
                      if (it.key == K_STICK) continue
                      val dim = !it.visible
                      if (dim && !edit) continue
                      when (it.key) {
                          K_DPAD -> {
                              l.add(Circ(4, "▲", it.cx, it.cy - it.sp, it.r, dim)); l.add(Circ(5, "▼", it.cx, it.cy + it.sp, it.r, dim))
                              l.add(Circ(6, "◀", it.cx - it.sp, it.cy, it.r, dim)); l.add(Circ(7, "▶", it.cx + it.sp, it.cy, it.r, dim))
                          }
                          K_C -> {
                              l.add(Circ(100, "C▲", it.cx, it.cy - it.sp, it.r, dim)); l.add(Circ(101, "C▼", it.cx, it.cy + it.sp, it.r, dim))
                              l.add(Circ(102, "C◀", it.cx - it.sp, it.cy, it.r, dim)); l.add(Circ(103, "C▶", it.cx + it.sp, it.cy, it.r, dim))
                          }
                          else -> l.add(Circ(it.key, label(it.key), it.cx, it.cy, it.r, dim))
                      }
                  }
                  circs = l
              }

              override fun onDraw(c: Canvas) {
                  val st = stick
                  if (st != null) {
                      val active = stickPid != -1
                      val bx = if (active) ox else st.cx
                      val by = if (active) oy else st.cy
                      val sr = st.r
                      paint.style = Paint.Style.FILL
                      paint.color = Color.argb(if (active) 80 else 45, 255, 255, 255)
                      c.drawCircle(bx, by, sr, paint)
                      paint.color = Color.argb(if (active) 170 else 90, 255, 255, 255)
                      c.drawCircle(bx + kx * sr, by + ky * sr, sr * 0.4f, paint)
                      if (edit) {
                          paint.color = Color.argb(220, 0, 0, 0)
                          paint.textSize = sr * 0.25f
                          paint.textAlign = Paint.Align.CENTER
                          c.drawText("Analógico", bx, by + sr * 0.9f + 0f, paint)
                      }
                  }
                  for (b in circs) {
                      val on = !edit && (if (b.id < 16) pressed[b.id] else isCOn(b.id))
                      val a = if (b.dim) 30 else if (on) 170 else 80
                      paint.style = Paint.Style.FILL
                      paint.color = Color.argb(a, 255, 255, 255)
                      c.drawCircle(b.x, b.y, b.r, paint)
                      paint.color = Color.argb(if (b.dim) 90 else 220, 0, 0, 0)
                      if (b.dim) paint.color = Color.argb(160, 255, 255, 255)
                      paint.textSize = b.r * 0.8f
                      paint.textAlign = Paint.Align.CENTER
                      c.drawText(b.label, b.x, b.y + b.r * 0.28f, paint)
                  }
                  val sel = selected
                  if (edit && sel != null) {
                      paint.style = Paint.Style.STROKE
                      paint.strokeWidth = dp(3f)
                      paint.color = Color.rgb(255, 214, 10)
                      when (sel.key) {
                          K_STICK -> c.drawCircle(sel.cx, sel.cy, sel.r + dp(4f), paint)
                          K_DPAD, K_C -> {
                              val e = sel.sp + sel.r + dp(6f)
                              c.drawRoundRect(sel.cx - e, sel.cy - e, sel.cx + e, sel.cy + e, dp(12f), dp(12f), paint)
                          }
                          else -> c.drawCircle(sel.cx, sel.cy, sel.r + dp(5f), paint)
                      }
                      paint.style = Paint.Style.FILL
                  }
              }

              private fun isCOn(id: Int) = when (id) {
                  100 -> cY < -0.5f
                  101 -> cY > 0.5f
                  102 -> cX < -0.5f
                  else -> cX > 0.5f
              }

              private fun overButton(x: Float, y: Float): Boolean {
                  for (b in circs) if (hypot(x - b.x, y - b.y) < b.r * 1.25f) return true
                  return false
              }

              // ---------- edição ----------

              private fun hit(it: Item, x: Float, y: Float): Boolean = when (it.key) {
                  K_STICK -> hypot(x - it.cx, y - it.cy) < it.r
                  K_DPAD, K_C -> {
                      val e = it.sp + it.r * 1.2f
                      abs(x - it.cx) < e && abs(y - it.cy) < e
                  }
                  else -> hypot(x - it.cx, y - it.cy) < maxOf(it.r * 1.3f, dp(24f))
              }

              private fun notifySelection() {
                  val s = selected
                  if (s == null) onSelection?.invoke(null, 100, true, false)
                  else onSelection?.invoke(s.name, Math.round(s.scale * 100f), s.visible, s.key != K_STICK)
              }

              private fun editTouch(e: MotionEvent): Boolean {
                  val x = e.x
                  val y = e.y
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          // o último da lista fica "por cima"; escolhe o mais próximo entre os que o dedo alcança
                          var best: Item? = null
                          var bestD = Float.MAX_VALUE
                          for (it in items) {
                              if (hit(it, x, y)) {
                                  val d = hypot(x - it.cx, y - it.cy)
                                  if (d < bestD) { best = it; bestD = d }
                              }
                          }
                          selected = best
                          if (best != null) { dragDx = best.cx - x; dragDy = best.cy - y }
                          notifySelection()
                      }
                      MotionEvent.ACTION_MOVE -> {
                          val s = selected
                          if (s != null) {
                              val m = if (s.key == K_DPAD || s.key == K_C) s.sp + s.r else s.r
                              s.cx = (x + dragDx).coerceIn(m, maxOf(m, width - m))
                              s.cy = (y + dragDy).coerceIn(m, maxOf(m, height - m))
                              rebuild()
                          }
                      }
                  }
                  invalidate()
                  return true
              }

              /** Tamanho do item selecionado, em % (50..200). */
              fun setScalePercent(p: Int) {
                  val s = selected ?: return
                  s.scale = (p / 100f).coerceIn(0.5f, 2f)
                  rebuild()
                  invalidate()
              }

              fun toggleVisible() {
                  val s = selected ?: return
                  if (s.key == K_STICK) return
                  s.visible = !s.visible
                  rebuild()
                  notifySelection()
                  invalidate()
              }

              /** Volta tudo ao padrão na tela do editor; só vale de verdade depois de Salvar. */
              fun resetLayout() {
                  ignoreSaved = true
                  onSizeChanged(width, height, width, height)
                  ignoreSaved = false
                  notifySelection()
                  invalidate()
              }

              fun saveLayout() {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  if (w <= 0f || h <= 0f) return
                  val m = HashMap<Int, ItemPrefs>()
                  for (it in items) m[it.key] = ItemPrefs(it.cx / w, it.cy / h, it.scale, it.visible)
                  ControlsLayout.save(context, m)
              }

              // ---------- jogo ----------

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  if (edit) return editTouch(e)
                  val st = stick
                  val act = e.actionMasked
                  val ai = e.actionIndex
                  val stickR = st?.r ?: 1f
                  when (act) {
                      MotionEvent.ACTION_DOWN, MotionEvent.ACTION_POINTER_DOWN -> {
                          val x = e.getX(ai)
                          val y = e.getY(ai)
                          if (st != null && stickPid == -1 && abs(x - st.cx) < 0.28f * width && y > st.cy - 0.26f * height && !overButton(x, y)) {
                              stickPid = e.getPointerId(ai)
                              ox = x
                              oy = y
                          }
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_POINTER_UP -> {
                          if (e.getPointerId(ai) == stickPid) stickPid = -1
                      }
                      MotionEvent.ACTION_CANCEL -> stickPid = -1
                  }
                  val lifting = act == MotionEvent.ACTION_UP || act == MotionEvent.ACTION_POINTER_UP
                  val cancel = act == MotionEvent.ACTION_CANCEL

                  // analógico
                  var sx = 0f
                  var sy = 0f
                  kx = 0f
                  ky = 0f
                  if (stickPid != -1) {
                      val idx = e.findPointerIndex(stickPid)
                      if (idx >= 0) {
                          val px = e.getX(idx)
                          val py = e.getY(idx)
                          var dx = px - ox
                          var dy = py - oy
                          val d = hypot(dx, dy)
                          if (d > stickR) {
                              val k = (d - stickR) / d
                              ox += dx * k
                              oy += dy * k
                              dx = px - ox
                              dy = py - oy
                          }
                          var nx = dx / stickR
                          var ny = dy / stickR
                          kx = nx
                          ky = ny
                          val mag = hypot(nx, ny)
                          if (mag < dead) {
                              nx = 0f
                              ny = 0f
                          } else {
                              val s = ((mag - dead) / (1f - dead)).coerceAtMost(1f) / mag
                              nx *= s
                              ny *= s
                          }
                          sx = nx
                          sy = ny
                      } else {
                          stickPid = -1
                      }
                  }

                  // botões
                  val np = BooleanArray(16)
                  var ncx = 0f
                  var ncy = 0f
                  if (!cancel) {
                      for (i in 0 until e.pointerCount) {
                          if (lifting && i == ai) continue
                          if (e.getPointerId(i) == stickPid) continue
                          val x = e.getX(i)
                          val y = e.getY(i)
                          for (b in circs) {
                              if (hypot(x - b.x, y - b.y) < b.r * 1.25f) {
                                  when (b.id) {
                                      100 -> ncy = -1f
                                      101 -> ncy = 1f
                                      102 -> ncx = -1f
                                      103 -> ncx = 1f
                                      else -> np[b.id] = true
                                  }
                              }
                          }
                      }
                  }
                  for (i in 0..15) {
                      if (np[i] != pressed[i]) {
                          pressed[i] = np[i]
                          NativeBridge.setButton(i, np[i])
                      }
                  }
                  if (sx != outX || sy != outY) {
                      outX = sx
                      outY = sy
                      NativeBridge.setAnalog(0, sx, sy)
                  }
                  if (ncx != cX || ncy != cY) {
                      cX = ncx
                      cY = ncy
                      NativeBridge.setAnalog(1, cX, cY)
                  }
                  invalidate()
                  return true
              }
          }
