          package dev.n64emu.app

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject

          /** Nome seguro para arquivo (usado nos saves e nas pastas de texturas). */
          fun safeFileName(s: String): String = s.replace(Regex("[/\\\\:*?\"<>|]"), "_").trim().ifEmpty { "jogo" }

          /**
           * title: nome mostrado (vira o nome oficial quando o jogo é reconhecido).
           * saveKey: nome do arquivo de save (.srm). Nunca muda depois de criado, para não perder o save.
           * crc: CRC32 da ROM (formato z64), usado para reconhecer o jogo.
           */
          data class Game(
              val id: String,
              val uri: String,
              var title: String,
              val romName: String,
              var cover: String?,
              var crc: String? = null,
              var saveKey: String = safeFileName(title),
              var recognized: Boolean = false
          )

          class Library(ctx: Context) {
              private val prefs = ctx.getSharedPreferences("n64emu_lib", Context.MODE_PRIVATE)
              val games = mutableListOf<Game>()

              init { load() }

              private fun load() {
                  games.clear()
                  try {
                      val arr = JSONArray(prefs.getString("games", "[]"))
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          val cover = if (o.has("cover") && !o.isNull("cover")) o.getString("cover") else null
                          val title = o.getString("title")
                          val crc = if (o.has("crc") && !o.isNull("crc")) o.getString("crc") else null
                          val key = o.optString("saveKey", "").ifEmpty { safeFileName(title) }
                          games.add(Game(o.getString("id"), o.getString("uri"), title, o.optString("romName"), cover, crc, key, o.optBoolean("recognized", false)))
                      }
                  } catch (e: Exception) {
                      games.clear()
                  }
              }

              @Synchronized
              fun save() {
                  val arr = JSONArray()
                  for (g in games) {
                      val o = JSONObject()
                      o.put("id", g.id)
                      o.put("uri", g.uri)
                      o.put("title", g.title)
                      o.put("romName", g.romName)
                      o.put("saveKey", g.saveKey)
                      o.put("recognized", g.recognized)
                      if (g.cover != null) o.put("cover", g.cover)
                      if (g.crc != null) o.put("crc", g.crc)
                      arr.put(o)
                  }
                  prefs.edit().putString("games", arr.toString()).apply()
              }

              @Synchronized
              fun add(g: Game) {
                  if (games.none { it.uri == g.uri }) {
                      // dois jogos com o mesmo nome de arquivo não podem dividir o mesmo save
                      var key = g.saveKey
                      var n = 2
                      while (games.any { it.saveKey == key }) { key = g.saveKey + "-" + n; n++ }
                      g.saveKey = key
                      games.add(g)
                      save()
                  }
              }

              @Synchronized
              fun remove(id: String) {
                  games.removeAll { it.id == id }
                  save()
              }

              fun find(id: String): Game? = games.firstOrNull { it.id == id }
          }
