          cat > app/src/main/java/dev/n64emu/app/Saves.kt <<'N64EMU_EOF'
          package dev.n64emu.app

          import android.content.Context
          import android.net.Uri
          import android.provider.OpenableColumns
          import java.io.File
          import java.io.InputStream

          /**
           * Saves ficam em Storage.savesDir como "<saveKey>.srm" (o arquivo que o host grava sozinho).
           * Importar .eep/.mpk/.sra/.fla copia o arquivo para "<saveKey>.<ext>"; o host aplica por cima
           * do .srm na próxima vez que o jogo abre (ver loadSram no native-lib.cpp).
           */
          object Saves {
              const val SRM_SIZE = 0x48800

              fun file(ctx: Context, g: Game): File = File(Storage.savesDir(ctx), g.saveKey + ".srm")

              private fun pending(ctx: Context, g: Game): List<File> =
                  listOf("eep", "mpk", "sra", "fla").map { File(Storage.savesDir(ctx), g.saveKey + "." + it) }.filter { it.exists() }

              fun hasPending(ctx: Context, g: Game): Boolean = pending(ctx, g).isNotEmpty()

              fun fileName(ctx: Context, uri: Uri): String {
                  var name: String? = null
                  try {
                      val c = ctx.contentResolver.query(uri, arrayOf(OpenableColumns.DISPLAY_NAME), null, null, null)
                      if (c != null) {
                          if (c.moveToFirst()) name = c.getString(0)
                          c.close()
                      }
                  } catch (e: Exception) {
                  }
                  return name ?: uri.lastPathSegment ?: ""
              }

              private fun readLimited(i: InputStream, max: Int): ByteArray? {
                  val out = java.io.ByteArrayOutputStream()
                  val buf = ByteArray(8192)
                  while (true) {
                      val r = i.read(buf)
                      if (r < 0) break
                      out.write(buf, 0, r)
                      if (out.size() > max) return null
                  }
                  return out.toByteArray()
              }

              /** Importa um arquivo de save para o jogo. Devolve a mensagem para mostrar ao usuário. */
              fun importFrom(ctx: Context, uri: Uri, g: Game): String {
                  val data = try {
                      ctx.contentResolver.openInputStream(uri)?.use { readLimited(it, 2_000_000) }
                  } catch (e: Exception) {
                      null
                  } ?: return "Não consegui ler esse arquivo (ou ele é grande demais para ser um save)."
                  val ext = fileName(ctx, uri).substringAfterLast('.', "").lowercase()
                  val dir = Storage.savesDir(ctx)
                  when (ext) {
                      "srm" -> {
                          val dest = file(ctx, g)
                          if (dest.exists()) dest.copyTo(File(dir, g.saveKey + ".srm.bak"), overwrite = true)
                          dest.writeBytes(data)
                          return if (data.size == SRM_SIZE) "Save importado. Abra o jogo para usar."
                          else "Save importado, mas o tamanho (${data.size} bytes) é diferente do esperado ($SRM_SIZE). Se o jogo não reconhecer, o save é de outro núcleo."
                      }
                      "eep" -> {
                          if (data.size != 512 && data.size != 2048) return "Arquivo .eep com tamanho inesperado (${data.size} bytes). Esperado 512 ou 2048."
                          File(dir, g.saveKey + ".eep").writeBytes(data)
                      }
                      "mpk", "cpk" -> {
                          if (data.size != 32768) return "Arquivo de Controller Pak com tamanho inesperado (${data.size} bytes). Esperado 32768."
                          File(dir, g.saveKey + ".mpk").writeBytes(data)
                      }
                      "sra" -> {
                          if (data.size != 32768) return "Arquivo .sra com tamanho inesperado (${data.size} bytes). Esperado 32768."
                          File(dir, g.saveKey + ".sra").writeBytes(data)
                      }
                      "fla" -> {
                          if (data.size != 131072) return "Arquivo .fla com tamanho inesperado (${data.size} bytes). Esperado 131072."
                          File(dir, g.saveKey + ".fla").writeBytes(data)
                      }
                      else -> return "Formato não reconhecido. Use .srm, .eep, .mpk, .sra ou .fla."
                  }
                  return "Save importado. Ele será aplicado na próxima vez que você abrir o jogo."
              }

              fun exportTo(ctx: Context, g: Game, dest: Uri): Boolean {
                  return try {
                      val f = file(ctx, g)
                      if (!f.exists()) return false
                      ctx.contentResolver.openOutputStream(dest)?.use { o -> f.inputStream().use { it.copyTo(o) } } != null
                  } catch (e: Exception) {
                      false
                  }
              }

              fun delete(ctx: Context, g: Game) {
                  file(ctx, g).delete()
                  File(Storage.savesDir(ctx), g.saveKey + ".srm.bak").delete()
                  pending(ctx, g).forEach { it.delete() }
              }
          }
          N64EMU_EOF
          cat > app/src/main/java/dev/n64emu/app/SavesTab.kt <<'N64EMU_EOF'
          package dev.n64emu.app

          import android.net.Uri
          import android.text.format.Formatter
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Toast
          import androidx.appcompat.app.AlertDialog
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class SavesTab(private val act: MainActivity) {
              val view = ScrollView(act)
              private val col = LinearLayout(act)
              private var pickedUri: Uri? = null
              private var exportGame: Game? = null

              private fun dp(v: Int) = Ui.dp(act, v)

              init {
                  col.orientation = LinearLayout.VERTICAL
                  col.setPadding(dp(12), dp(12), dp(12), dp(12))
                  view.addView(col)
              }

              fun refresh() {
                  col.removeAllViews()
                  col.addView(Ui.text(act, "Saves", 26f, bold = true))

                  val imp = Ui.card(act)
                  imp.addView(Ui.text(act, "Importar save", 18f, bold = true))
                  imp.addView(Ui.text(act, "Aceita .srm (de outro app com o mesmo núcleo), .eep, .mpk, .sra e .fla. Depois você escolhe para qual jogo.", 13f, Ui.SUB))
                  imp.addView(Ui.button(act, "Escolher arquivo de save") { act.pickSave.launch(arrayOf("*/*")) })
                  col.addView(imp)

                  val games = act.library.games
                  if (games.isEmpty()) {
                      val t = Ui.text(act, "Adicione um jogo na aba Jogos para ver os saves dele aqui.", 14f, Ui.SUB)
                      t.setPadding(0, dp(8), 0, dp(8))
                      col.addView(t)
                  }
                  val fmt = SimpleDateFormat("dd/MM/yyyy HH:mm", Locale.getDefault())
                  for (g in games) {
                      val card = Ui.card(act)
                      card.addView(Ui.text(act, g.title, 16f, bold = true))
                      val f = Saves.file(act, g)
                      val status = when {
                          f.exists() -> "Save de ${Formatter.formatShortFileSize(act, f.length())} · ${fmt.format(Date(f.lastModified()))}"
                          Saves.hasPending(act, g) -> "Save importado, será aplicado ao abrir o jogo"
                          else -> "Sem save ainda"
                      }
                      card.addView(Ui.text(act, status, 13f, Ui.SUB))
                      val row = LinearLayout(act)
                      row.orientation = LinearLayout.HORIZONTAL
                      row.setPadding(0, dp(8), 0, 0)
                      val lp = { LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f) }
                      row.addView(Ui.button(act, "Importar") { pickFor(g) }, lp())
                      if (f.exists()) {
                          row.addView(Ui.button(act, "Exportar") {
                              exportGame = g
                              act.createSave.launch(g.saveKey + ".srm")
                          }, lp())
                      }
                      if (f.exists() || Saves.hasPending(act, g)) {
                          row.addView(Ui.button(act, "Apagar") {
                              AlertDialog.Builder(act)
                                  .setTitle("Apagar o save de ${g.title}?")
                                  .setMessage("Isso não pode ser desfeito. Exporte antes se quiser guardar uma cópia.")
                                  .setPositiveButton("Apagar") { _, _ -> Saves.delete(act, g); refresh() }
                                  .setNegativeButton("Cancelar", null)
                                  .show()
                          }, lp())
                      }
                      card.addView(row)
                      col.addView(card)
                  }

                  val manual = Ui.card(act)
                  manual.addView(Ui.text(act, "Pasta dos saves", 18f, bold = true))
                  manual.addView(Ui.text(act, "Cada jogo usa o arquivo NOME.srm nesta pasta. Se preferir, copie o save direto para lá com o jogo fechado.", 13f, Ui.SUB))
                  val path = Ui.text(act, Storage.savesDir(act).absolutePath + "/", 12f, Ui.SUB)
                  path.setTextIsSelectable(true)
                  manual.addView(path)
                  col.addView(manual)
              }

              /** Chamado pela MainActivity quando o usuário escolheu um arquivo de save. */
              fun onSavePicked(uri: Uri) {
                  pickedUri = uri
                  val games = act.library.games
                  if (games.isEmpty()) {
                      Toast.makeText(act, "Adicione um jogo primeiro na aba Jogos.", Toast.LENGTH_LONG).show()
                      return
                  }
                  AlertDialog.Builder(act)
                      .setTitle("Save para qual jogo?")
                      .setItems(games.map { it.title }.toTypedArray()) { _, i -> importInto(games[i]) }
                      .show()
              }

              /** Arquivo escolhido pelo botão "Importar" de um jogo específico. */
              fun onSavePickedFor(uri: Uri, g: Game) {
                  pickedUri = uri
                  importInto(g)
              }

              private fun pickFor(g: Game) {
                  // atalho: o botão "Importar" do cartão já define o jogo, o arquivo é escolhido em seguida
                  act.saveTargetGame = g
                  act.pickSave.launch(arrayOf("*/*"))
              }

              fun importInto(g: Game) {
                  val uri = pickedUri ?: return
                  val msg = Saves.importFrom(act, uri, g)
                  Toast.makeText(act, msg, Toast.LENGTH_LONG).show()
                  refresh()
              }

              fun onExportTo(dest: Uri) {
                  val g = exportGame ?: return
                  val ok = Saves.exportTo(act, g, dest)
                  Toast.makeText(act, if (ok) "Save exportado." else "Não consegui exportar o save.", Toast.LENGTH_LONG).show()
              }
          }
