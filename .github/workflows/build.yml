                          sizeLabel.text = "Tamanho: ${v + 50}%"
                          cv.setScalePercent(v + 50)
                      }
                      override fun onStartTrackingTouch(sb: SeekBar?) {}
                      override fun onStopTrackingTouch(sb: SeekBar?) {}
                  })
                  panel.addView(seek)

                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.setPadding(0, dp(4), 0, 0)
                  val hide = small(Ui.button(this, "Ocultar") { cv.toggleVisible() })
                  hide.isEnabled = false
                  val reset = small(Ui.button(this, "Padrão") { cv.resetLayout() })
                  val cancel = small(Ui.button(this, "Cancelar") { finish() })
                  val ok = small(Ui.button(this, "Salvar") { cv.saveLayout(); finish() })
                  val lp = { LinearLayout.LayoutParams(0, dp(40), 1f).apply { setMargins(dp(2), 0, dp(2), 0) } }
                  row.addView(hide, lp())
                  row.addView(reset, lp())
                  row.addView(cancel, lp())
                  row.addView(ok, lp())
                  panel.addView(row)

                  cv.onSelection = { name, percent, visible, canHide ->
                      title.text = if (name == null) "Toque num botão e arraste para mover" else "Selecionado: $name"
                      seek.isEnabled = name != null
                      seek.progress = (percent - 50).coerceIn(0, 150)
                      sizeLabel.text = "Tamanho: $percent%"
                      hide.isEnabled = canHide
                      hide.text = if (visible) "Ocultar" else "Mostrar"
                  }

                  val w = (resources.displayMetrics.widthPixels * 0.46f).toInt()
                  root.addView(panel, FrameLayout.LayoutParams(w, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.TOP or Gravity.CENTER_HORIZONTAL))
                  setContentView(root)

                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  val ctl = WindowInsetsControllerCompat(window, root)
                  ctl.hide(WindowInsetsCompat.Type.systemBars())
                  ctl.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
              }
          }
