          package dev.n64emu.app

          import android.content.Context
          import org.json.JSONObject

          /** Posição (fração da tela), tamanho e visibilidade de cada item dos controles na tela. */
          class ItemPrefs(val x: Float, val y: Float, val scale: Float, val visible: Boolean)

          object ControlsLayout {
              private const val KEY = "layout"

              private fun prefs(ctx: Context) = ctx.getSharedPreferences("n64emu_controls", Context.MODE_PRIVATE)

              fun load(ctx: Context): Map<Int, ItemPrefs> {
                  val out = HashMap<Int, ItemPrefs>()
                  try {
                      val o = JSONObject(prefs(ctx).getString(KEY, "{}") ?: "{}")
                      for (k in o.keys()) {
                          val v = o.getJSONObject(k)
                          out[k.toInt()] = ItemPrefs(
                              v.getDouble("x").toFloat(), v.getDouble("y").toFloat(),
                              v.optDouble("s", 1.0).toFloat(), v.optBoolean("v", true)
                          )
                      }
                  } catch (e: Exception) {
                      out.clear()
                  }
                  return out
              }

              fun save(ctx: Context, items: Map<Int, ItemPrefs>) {
                  val o = JSONObject()
                  for ((k, v) in items) {
                      val j = JSONObject()
                      j.put("x", v.x.toDouble())
                      j.put("y", v.y.toDouble())
                      j.put("s", v.scale.toDouble())
                      j.put("v", v.visible)
                      o.put(k.toString(), j)
                  }
                  prefs(ctx).edit().putString(KEY, o.toString()).apply()
              }

              fun reset(ctx: Context) {
                  prefs(ctx).edit().remove(KEY).apply()
              }
          }
