                      val p = Covers.saveFromUri(this, uri, id)
                      runOnUiThread {
                          if (p != null) {
                              library.find(id)?.cover = p
                              library.save()
                              games.refresh()
                          } else {
                              Toast.makeText(this, "Não consegui usar essa imagem.", Toast.LENGTH_LONG).show()
                          }
                      }
                  }.start()
              }
