          package dev.n64emu.app

          import android.content.Context
          import android.net.Uri
          import android.provider.OpenableColumns
          import java.util.zip.CRC32

          object Rom {
              fun displayName(ctx: Context, uri: Uri): String {
                  var name: String? = null
                  try {
                      val c = ctx.contentResolver.query(uri, arrayOf(OpenableColumns.DISPLAY_NAME), null, null, null)
                      if (c != null) {
                          if (c.moveToFirst()) name = c.getString(0)
                          c.close()
                      }
                  } catch (e: Exception) {
                  }
                  val n = name ?: uri.lastPathSegment ?: "ROM"
                  return n.substringBeforeLast('.')
              }

              /** Converte um bloco para a ordem de bytes z64 (big-endian). mode: 0 = z64, 1 = v64, 2 = n64. */
              private fun normalize(buf: ByteArray, len: Int, mode: Int) {
                  when (mode) {
                      1 -> {
                          var i = 0
                          while (i + 1 < len) { val t = buf[i]; buf[i] = buf[i + 1]; buf[i + 1] = t; i += 2 }
                      }
                      2 -> {
                          var i = 0
                          while (i + 3 < len) {
                              val a = buf[i]; val b = buf[i + 1]
                              buf[i] = buf[i + 3]; buf[i + 1] = buf[i + 2]; buf[i + 2] = b; buf[i + 3] = a
                              i += 4
                          }
                      }
                  }
              }

              private fun modeOf(first: Int): Int = when (first and 0xFF) {
                  0x80 -> 0
                  0x37 -> 1
                  0x40 -> 2
                  else -> -1
              }

              /** Primeiros 0x40 bytes do cabeçalho, já em ordem z64. */
              private fun header(ctx: Context, uri: Uri): ByteArray? {
                  try {
                      val buf = ByteArray(0x40)
                      val ins = ctx.contentResolver.openInputStream(uri) ?: return null
                      var off = 0
                      ins.use {
                          while (off < buf.size) {
                              val r = it.read(buf, off, buf.size - off)
                              if (r < 0) break
                              off += r
                          }
                      }
                      if (off < buf.size) return null
                      val mode = modeOf(buf[0].toInt())
                      if (mode < 0) return null
                      normalize(buf, buf.size, mode)
                      return buf
                  } catch (e: Exception) {
                      return null
                  }
              }

              /** Nome interno do cabeçalho da ROM (usado como nome da pasta de texturas HD). */
              fun internalName(ctx: Context, uri: Uri): String {
                  val h = header(ctx, uri) ?: return ""
                  return String(h, 0x20, 20, Charsets.US_ASCII).trim { it <= ' ' || it == '\u0000' }
              }

              /** Código de 4 letras do jogo (ex.: NSME). */
              fun gameCode(ctx: Context, uri: Uri): String {
                  val h = header(ctx, uri) ?: return ""
                  return String(h, 0x3B, 4, Charsets.US_ASCII).trim { it <= ' ' || it == '\u0000' }
              }

              /** CRC32 da ROM inteira em ordem z64 (é o CRC usado nas listas No-Intro). Null se não for uma ROM de N64. */
              fun crc32(ctx: Context, uri: Uri): String? {
                  try {
                      val ins = ctx.contentResolver.openInputStream(uri) ?: return null
                      val crc = CRC32()
                      val buf = ByteArray(1 shl 16)
                      var mode = -1
                      ins.use {
                          while (true) {
                              var n = 0
                              while (n < buf.size) {
                                  val r = it.read(buf, n, buf.size - n)
                                  if (r < 0) break
                                  n += r
                              }
                              if (n <= 0) break
                              if (mode == -1) {
                                  mode = modeOf(buf[0].toInt())
                                  if (mode < 0) return null
                              }
                              normalize(buf, n, mode)
                              crc.update(buf, 0, n)
                              if (n < buf.size) break
                          }
                      }
                      return String.format("%08X", crc.value)
                  } catch (e: Exception) {
                      return null
                  }
              }
          }
